<svg
  width="260"
  height="260"
  viewBox="0 0 260 260"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Círculo principal -->
  <circle
    cx="130"
    cy="130"
    r="95"
    stroke="currentColor"
    stroke-width="3"
  />

  <!-- Órbita irregular -->
  <path
    d="M40 140 
       C60 60, 200 60, 220 130
       C200 200, 80 200, 60 150"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Código central (mais compacto) -->
  <path
    d="M110 105 L90 130 L110 155"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M150 105 L170 130 L150 155"
