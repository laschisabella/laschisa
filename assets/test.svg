    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <line
    x1="140"
    y1="95"
    x2="120"
    y2="165"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
  />

  <path
    d="M75 175 A60 60 0 0 0 185 175"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M85 190 A70 70 0 0 0 175 190"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />

  <circle cx="70" cy="95" r="4" stroke="currentColor" stroke-width="2" />
  <circle cx="195" cy="165" r="4" stroke="currentColor" stroke-width="2" />
</svg>